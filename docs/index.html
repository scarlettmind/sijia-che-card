<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071f47">
  <meta name="description" content="Sijia Che — Business Development Department at airweave inc.">
  <title>Sijia Che — airweave</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/airweave-loop-mobile.mp4" as="video" media="(max-width:700px) and (orientation:portrait)" type="video/mp4">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" id="card" aria-label="Sijia Che digital business card">
    <video class="background-video" id="background-video" muted playsinline loop preload="auto" poster="assets/airfiber-bg.jpg" disablepictureinpicture aria-hidden="true">
      <source media="(max-width:700px) and (orientation:portrait)" src="assets/airweave-loop-mobile.mp4" type="video/mp4">
      <source src="assets/airweave-loop.mp4" type="video/mp4">
    </video>
    <div class="video-shade" aria-hidden="true"></div>

    <section class="intro" aria-hidden="true">
      <div class="intro-glow"></div>
      <img class="launch-logo" src="assets/airweave-logo.png" alt="">
    </section>

    <button class="play-gate" id="play-gate" type="button" hidden><i></i>TAP TO PLAY</button>
    <header class="brand"><img src="assets/airweave-logo.png" alt="airweave"></header>

    <section class="content">
      <div class="identity">
        <h1><span>Sijia</span> Che</h1>
        <p>Business Development Department</p>
      </div>
      <button class="save" type="button" id="save-contact">
        <span>SAVE CONTACT</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v15m0 0-5-5m5 5 5-5"></path></svg>
        <i class="ripple" aria-hidden="true"></i>
      </button>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
