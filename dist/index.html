<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a36">
  <meta name="description" content="Sijia Che — Business Development Department at airweave inc.">
  <title>Sijia Che — airweave</title>
  <link rel="preload" href="assets/airfiber-bg.jpg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" aria-label="Sijia Che digital business card">
    <div class="background" aria-hidden="true"></div>
    <div class="flow flow-a" aria-hidden="true"></div>
    <div class="flow flow-b" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <section class="intro" aria-hidden="true">
      <div class="fiber-mark">
        <svg class="fibers" viewBox="0 0 520 160" role="presentation">
          <path d="M22 92C112 18 173 137 259 79S408 25 498 78" />
          <path d="M25 111C117 36 190 151 276 91S414 42 494 60" />
          <path d="M32 68C125 6 182 115 248 66S393 8 488 91" />
        </svg>
        <img src="assets/airweave-logo.png" alt="">
      </div>
    </section>

    <header class="brand"><img src="assets/airweave-logo.png" alt="airweave"></header>

    <section class="content">
      <div class="identity">
        <h1><span>Sijia</span> Che</h1>
        <p>Business Development Department</p>
      </div>
      <button class="save" type="button" id="save-contact">
        <span>SAVE CONTACT</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v15m0 0-5-5m5 5 5-5"/></svg>
        <i class="ripple" aria-hidden="true"></i>
      </button>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
